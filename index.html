<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fiche individuelle d’un artiste Rap Jungle."><title>Rap Jungle — Fiche artiste</title>
<style>
*{box-sizing:border-box}:root{--text:#f6f8f6;--muted:#b7c3b7;--line:#34523c;--orange:#ef8f1b;--orange2:#ffb13b}body{margin:0;color:var(--text);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 12% 18%,rgba(88,166,84,.17),transparent 18%),radial-gradient(circle at 87% 22%,rgba(255,165,0,.1),transparent 20%),linear-gradient(180deg,#08100c,#0b1510 38%,#0a130f);min-height:100vh}a{color:inherit;text-decoration:none}.wrap{max-width:1160px;margin:auto;padding:18px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding:18px;border:1px solid rgba(88,144,80,.45);border-radius:22px;background:linear-gradient(180deg,rgba(22,36,26,.94),rgba(14,24,18,.93));box-shadow:0 16px 40px rgba(0,0,0,.28)}.brand{font-size:clamp(34px,7vw,66px);font-weight:900;line-height:.88}.sub{margin-top:8px;color:#dbe7db;font-size:13px;letter-spacing:.18em}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn,button{border:0;border-radius:14px;min-height:48px;padding:12px 16px;font-weight:900;cursor:pointer;background:linear-gradient(180deg,#fff,#f1f1f1);color:#111;box-shadow:0 8px 18px rgba(0,0,0,.22);font-size:14px}.secondary{background:linear-gradient(180deg,#236637,#194d29)!important;color:#fff!important}.goodbtn{background:linear-gradient(180deg,#ef8f1b,#d47306)!important;color:#fff!important}.ghost{background:#16251b!important;color:#fff!important;border:1px solid #34523c!important}.profile-hero{border:1px solid rgba(74,120,76,.6);border-radius:22px;overflow:hidden;background:#111b15;box-shadow:0 14px 35px rgba(0,0,0,.3)}.banner{height:260px;background:radial-gradient(circle at 25% 25%,rgba(255,177,59,.25),transparent 32%),linear-gradient(135deg,#315938,#0b140f);background-size:cover;background-position:center;position:relative}.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(5,10,7,.86))}.hero-info{display:grid;grid-template-columns:160px 1fr auto;gap:20px;align-items:end;padding:0 24px 24px;margin-top:-76px;position:relative;z-index:2}.avatar{width:160px;height:160px;border-radius:50%;border:6px solid #111b15;background:linear-gradient(135deg,#ef8f1b,#27623b);display:grid;place-items:center;font-size:46px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.hero-info h1{font-size:clamp(34px,6vw,60px);line-height:.95;margin:0 0 8px}.meta{color:var(--orange2);font-size:14px;font-weight:900}.status{display:inline-block;border:1px solid #58795e;border-radius:999px;padding:7px 11px;font-size:12px;background:#17261b;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.content{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:15px;align-items:start;margin-top:15px}.panel{background:linear-gradient(180deg,rgba(18,28,21,.96),rgba(13,21,16,.97));border:1px solid rgba(74,120,76,.6);border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 10px 28px rgba(0,0,0,.22)}.panel h2{font-size:25px;margin:0 0 12px}.panel h2:before{content:"🌿";font-size:18px;margin-right:8px}.text{font-size:16px;line-height:1.68;color:#dce6dc;white-space:pre-wrap}.small{font-size:13px;color:var(--muted);line-height:1.5}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.fact{border:1px solid #34523c;background:#0d1710;border-radius:14px;padding:13px}.fact b{display:block;color:var(--orange2);font-size:13px;margin-bottom:4px}.qa{padding:15px 0;border-bottom:1px solid #29452f}.qa:last-child{border:0}.qa h3{font-size:17px;margin:0 0 7px}.qa p{margin:0;color:#d5e0d5;line-height:1.55;white-space:pre-wrap}.links{display:grid;gap:9px}.links a{display:flex;justify-content:space-between;align-items:center;border:1px solid #34523c;background:#101a13;border-radius:13px;padding:13px;font-weight:900}.links a:after{content:'↗';color:var(--orange2)}.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.media-card{border:1px solid #34523c;background:#0b120e;border-radius:15px;padding:17px;min-height:125px;display:flex;flex-direction:column;justify-content:space-between}.media-card b{font-size:19px}.merch{background:radial-gradient(circle at 85% 20%,rgba(239,143,27,.18),transparent 30%),#101a13}.empty{padding:24px;text-align:center;color:var(--muted)}footer{text-align:center;padding:24px;color:#91a491;font-size:13px}
@media(max-width:850px){.hero-info{grid-template-columns:120px 1fr}.avatar{width:120px;height:120px}.actions{grid-column:1/-1;justify-content:flex-start}.content{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}}

</style></head>
<body><div class="wrap"><header class="top"><a href="https://rap16barvote-jungle.vercel.app/"><div class="brand">RAP JUNGLE</div><div class="sub">FICHE ARTISTE</div></a><nav class="nav"><a class="btn secondary" href="https://rap16barvote-jungle.vercel.app/">ACCUEIL</a><a class="btn goodbtn" href="artistes.html">ARTISTES</a><a class="btn secondary" href="vip.html">VIP</a><a class="btn secondary" href="boutique.html">BOUTIQUE</a></nav></header><main id="app"></main><footer>RAP JUNGLE × MEYDEN — Profil artistique</footer></div>
<script>
const DEMO={id:'demo-jungle',stageName:'Le MC de la Jungle',artistType:'MC / rappeur',region:'Montréal',genre:'Rap francophone',experienceYears:'5',presentation:'Une voix, une région et une histoire réunies dans un profil professionnel.',bio:'Ce profil de démonstration montre comment une fiche artiste Rap Jungle présentera le parcours, l’identité et les objectifs d’un artiste. Les véritables profils seront validés par l’administration avant leur publication publique.',experience:'Performances scéniques, création de contenu et participation à des événements de la scène locale.',influences:'Rap québécois, culture cypher et performance freestyle.',currentProject:'Développement d’une nouvelle série de capsules et de performances.',distinctive:'Une présence directe et une façon authentique de raconter son environnement.',message:'Créer des liens solides entre les artistes et le public.',preparing:'De nouvelles collaborations et du contenu original.',collaboration:'Beatmakers, vidéastes, salles et artistes de scène.',social:'',website:'',spotify:'',youtube:'',merchLink:'',merchText:'Une future collection pourra apparaître ici avec les produits et le lien vers la boutique.',bookingEmail:'',photo:'',status:'Démonstration'};
const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';const mail=u=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u||'')?u:'';function initials(n){return String(n||'RJ').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}function load(){const id=new URLSearchParams(location.search).get('id')||'demo-jungle';if(id==='demo-jungle')return DEMO;try{return JSON.parse(localStorage.getItem('rj-artist-profiles')||'[]').find(x=>x.id===id)||DEMO}catch{return DEMO}}function block(title,text){return text?`<section class="panel"><h2>${esc(title)}</h2><div class="text">${esc(text)}</div></section>`:''}function link(label,url){const safe=safeUrl(url);return safe?`<a href="${esc(safe)}" target="_blank" rel="noopener">${esc(label)}</a>`:''}const p=load(),photo=safeUrl(p.photo),banner=safeUrl(p.banner);document.title=`${p.stageName} — Rap Jungle`;const qa=[['Qu’est-ce qui te distingue?',p.distinctive],['Quel message veux-tu transmettre?',p.message],['Qu’est-ce que tu prépares présentement?',p.preparing||p.currentProject],['Quel type de collaboration recherches-tu?',p.collaboration]].filter(x=>x[1]);const links=[link('Réseau social',p.social),link('Site officiel',p.website),link('Écouter la musique',p.spotify),link('Voir les vidéos',p.youtube)].filter(Boolean);document.querySelector('#app').innerHTML=`<section class="profile-hero"><div class="banner" ${banner?`style="background-image:linear-gradient(transparent,rgba(5,10,7,.4)),url('${esc(banner)}')"`:''}></div><div class="hero-info"><div class="avatar">${photo?`<img src="${esc(photo)}" alt="${esc(p.stageName)}">`:esc(initials(p.stageName))}</div><div><div class="meta">${esc(p.artistType||'Artiste')} · ${esc(p.region||'Région à préciser')}</div><h1>${esc(p.stageName)}</h1><div>${esc(p.genre||'Style à préciser')}</div><span class="status">${esc(p.status||'Aperçu local')}</span></div><div class="actions"><button class="ghost" id="share">COPIER LE LIEN</button>${mail(p.bookingEmail)?`<a class="btn goodbtn" href="mailto:${esc(p.bookingEmail)}">BOOKING</a>`:''}</div></div></section><div class="content"><div>${block('Présentation',p.presentation)}${block('Biographie',p.bio)}<section class="panel"><h2>Expérience</h2><div class="text">${esc(p.experience||'L’expérience détaillée sera ajoutée à cette fiche.')}</div><div class="facts"><div class="fact"><b>RÉGION</b>${esc(p.region||'À préciser')}</div><div class="fact"><b>EXPÉRIENCE</b>${esc(p.experienceYears?p.experienceYears+' an'+(p.experienceYears==='1'?'':'s'):'À préciser')}</div><div class="fact"><b>STYLE</b>${esc(p.genre||'À préciser')}</div></div></section>${qa.length?`<section class="panel"><h2>Mini-conférence de presse</h2>${qa.map(x=>`<div class="qa"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join('')}</section>`:''}<section class="panel"><h2>Médias</h2><div class="media-grid">${safeUrl(p.spotify)?`<a class="media-card" href="${esc(p.spotify)}" target="_blank" rel="noopener"><span class="meta">MUSIQUE</span><b>Écouter l’artiste</b><span class="small">Ouvrir la plateforme ↗</span></a>`:''}${safeUrl(p.youtube)?`<a class="media-card" href="${esc(p.youtube)}" target="_blank" rel="noopener"><span class="meta">VIDÉO</span><b>Voir les contenus</b><span class="small">Ouvrir la chaîne ↗</span></a>`:''}${!safeUrl(p.spotify)&&!safeUrl(p.youtube)?'<div class="empty" style="grid-column:1/-1">Les médias seront ajoutés prochainement.</div>':''}</div></section></div><aside><section class="panel"><h2>Liens officiels</h2><div class="links">${links.join('')||'<div class="small">Les liens officiels seront ajoutés prochainement.</div>'}</div></section>${block('Influences',p.influences)}${block('Projet actuel',p.currentProject)}<section class="panel merch"><h2>Merch</h2><div class="text">${esc(p.merchText||'La collection de cet artiste sera présentée ici.')}</div>${safeUrl(p.merchLink)?`<a class="btn goodbtn" style="display:block;text-align:center;margin-top:14px" href="${esc(p.merchLink)}" target="_blank" rel="noopener">VOIR LE MERCH</a>`:'<a class="btn secondary" style="display:block;text-align:center;margin-top:14px" href="boutique.html">VISITER LA BOUTIQUE</a>'}</section></aside></div>`;document.querySelector('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.querySelector('#share').textContent='LIEN COPIÉ'}catch{document.querySelector('#share').textContent='COPIE IMPOSSIBLE'}};
</script></body></html>
