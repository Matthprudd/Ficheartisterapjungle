<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fiche individuelle d’un artiste Rap Jungle."><title>Rap Jungle — Fiche artiste</title>
<style>
*{box-sizing:border-box}:root{--text:#f6f8f6;--muted:#b7c3b7;--line:#34523c;--orange:#ef8f1b;--orange2:#ffb13b}body{margin:0;color:var(--text);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 12% 18%,rgba(88,166,84,.17),transparent 18%),radial-gradient(circle at 87% 22%,rgba(255,165,0,.1),transparent 20%),linear-gradient(180deg,#08100c,#0b1510 38%,#0a130f);min-height:100vh}a{color:inherit;text-decoration:none}.wrap{max-width:1160px;margin:auto;padding:18px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding:18px;border:1px solid rgba(88,144,80,.45);border-radius:22px;background:linear-gradient(180deg,rgba(22,36,26,.94),rgba(14,24,18,.93));box-shadow:0 16px 40px rgba(0,0,0,.28)}.brand{font-size:clamp(34px,7vw,66px);font-weight:900;line-height:.88}.sub{margin-top:8px;color:#dbe7db;font-size:13px;letter-spacing:.18em}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn,button{border:0;border-radius:14px;min-height:48px;padding:12px 16px;font-weight:900;cursor:pointer;background:linear-gradient(180deg,#fff,#f1f1f1);color:#111;box-shadow:0 8px 18px rgba(0,0,0,.22);font-size:14px}.secondary{background:linear-gradient(180deg,#236637,#194d29)!important;color:#fff!important}.goodbtn{background:linear-gradient(180deg,#ef8f1b,#d47306)!important;color:#fff!important}.ghost{background:#16251b!important;color:#fff!important;border:1px solid #34523c!important}.profile-hero{border:1px solid rgba(74,120,76,.6);border-radius:22px;overflow:hidden;background:#111b15;box-shadow:0 14px 35px rgba(0,0,0,.3)}.banner{height:260px;background:radial-gradient(circle at 25% 25%,rgba(255,177,59,.25),transparent 32%),linear-gradient(135deg,#315938,#0b140f);background-size:cover;background-position:center;position:relative}.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(5,10,7,.86))}.hero-info{display:grid;grid-template-columns:160px 1fr auto;gap:20px;align-items:end;padding:0 24px 24px;margin-top:-76px;position:relative;z-index:2}.avatar{width:160px;height:160px;border-radius:50%;border:6px solid #111b15;background:linear-gradient(135deg,#ef8f1b,#27623b);display:grid;place-items:center;font-size:46px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.hero-info h1{font-size:clamp(34px,6vw,60px);line-height:.95;margin:0 0 8px}.meta{color:var(--orange2);font-size:14px;font-weight:900}.status{display:inline-block;border:1px solid #58795e;border-radius:999px;padding:7px 11px;font-size:12px;background:#17261b;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.content{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:15px;align-items:start;margin-top:15px}.panel{background:linear-gradient(180deg,rgba(18,28,21,.96),rgba(13,21,16,.97));border:1px solid rgba(74,120,76,.6);border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 10px 28px rgba(0,0,0,.22)}.panel h2{font-size:25px;margin:0 0 12px}.panel h2:before{content:"🌿";font-size:18px;margin-right:8px}.text{font-size:16px;line-height:1.68;color:#dce6dc;white-space:pre-wrap}.small{font-size:13px;color:var(--muted);line-height:1.5}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.fact{border:1px solid #34523c;background:#0d1710;border-radius:14px;padding:13px}.fact b{display:block;color:var(--orange2);font-size:13px;margin-bottom:4px}.qa{padding:15px 0;border-bottom:1px solid #29452f}.qa:last-child{border:0}.qa h3{font-size:17px;margin:0 0 7px}.qa p{margin:0;color:#d5e0d5;line-height:1.55;white-space:pre-wrap}.links{display:grid;gap:9px}.links a{display:flex;justify-content:space-between;align-items:center;border:1px solid #34523c;background:#101a13;border-radius:13px;padding:13px;font-weight:900}.links a:after{content:'↗';color:var(--orange2)}.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.media-card{border:1px solid #34523c;background:#0b120e;border-radius:15px;padding:17px;min-height:125px;display:flex;flex-direction:column;justify-content:space-between}.media-card b{font-size:19px}.merch{background:radial-gradient(circle at 85% 20%,rgba(239,143,27,.18),transparent 30%),#101a13}.empty{padding:24px;text-align:center;color:var(--muted)}footer{text-align:center;padding:24px;color:#91a491;font-size:13px}
@media(max-width:850px){.hero-info{grid-template-columns:120px 1fr}.avatar{width:120px;height:120px}.actions{grid-column:1/-1;justify-content:flex-start}.content{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.wrap{padding:12px}.top{padding:15px}.nav{width:100%}.nav .btn{flex:1;padding:9px}.banner{height:190px}.hero-info{grid-template-columns:88px 1fr;padding:0 15px 18px;margin-top:-45px;gap:12px}.avatar{width:88px;height:88px;border-width:4px;font-size:29px}.hero-info h1{font-size:31px}.actions .btn{flex:1;text-align:center}.panel{padding:15px}.facts,.media-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><header class="top"><a href="https://rap16barvote-jungle.vercel.app/"><div class="brand">RAP JUNGLE</div><div class="sub">FICHE ARTISTE</div></a><nav class="nav"><a class="btn secondary" href="https://rap16barvote-jungle.vercel.app/">ACCUEIL</a><a class="btn goodbtn" href="https://r-pertoirerapjungle.vercel.app/">ARTISTES</a><a class="btn secondary" href="https://rapjunglevip.vercel.app/">VIP</a><a class="btn secondary" href="https://rapjungleboutique.vercel.app/#catalogue">BOUTIQUE</a></nav></header><main id="app"><div class="empty">Chargement de la fiche…</div></main><footer>RAP JUNGLE × MEYDEN — Profil artistique</footer></div>
<script>
const SUPABASE_URL='https://agijgxiljamrseyzvshr.supabase.co';
const SUPABASE_KEY='sb_publishable_T-QzG6_U5C2P63c8DTULtA_hv5AlF02';
const CORE_URL='https://dfdrbdoqewqttwjvfcwk.supabase.co';
const CORE_KEY='sb_publishable_FQ4pz3CMU6F7Rs8HaaAxdQ_GQqY0zfe';
const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const mail=u=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u||'')?u:'';
function initials(n){return String(n||'RJ').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function block(title,text){return text?`<section class="panel"><h2>${esc(title)}</h2><div class="text">${esc(text)}</div></section>`:''}
function link(label,url){const safe=safeUrl(url);return safe?`<a href="${esc(safe)}" target="_blank" rel="noopener">${esc(label)}</a>`:''}
function render(p){const photo=safeUrl(p.photo_url),banner=safeUrl(p.banner_url);document.title=`${p.stage_name} — Rap Jungle`;const qa=[['Qu’est-ce qui te distingue?',p.press_distinctive],['Quel message veux-tu transmettre?',p.press_message],['Qu’est-ce que tu prépares présentement?',p.press_preparing||p.current_project],['Quel type de collaboration recherches-tu?',p.press_collaboration]].filter(x=>x[1]);const links=[link('Réseau social',p.social_url),link('Site officiel',p.website_url),link('Écouter la musique',p.spotify_url),link('Voir les vidéos',p.youtube_url)].filter(Boolean);document.querySelector('#app').innerHTML=`<section class="profile-hero"><div class="banner" ${banner?`style="background-image:linear-gradient(transparent,rgba(5,10,7,.4)),url('${esc(banner)}')"`:''}></div><div class="hero-info"><div class="avatar">${photo?`<img src="${esc(photo)}" alt="${esc(p.stage_name)}">`:esc(initials(p.stage_name))}</div><div><div class="meta">${esc(p.artist_type||'Artiste')} · ${esc(p.region||'Région à préciser')}</div><h1>${esc(p.stage_name)}</h1><div>${esc(p.genre||'Style à préciser')}</div><span class="status">PROFIL VÉRIFIÉ</span></div><div class="actions"><button class="ghost" id="share">COPIER LE LIEN</button>${mail(p.booking_email)?`<a class="btn goodbtn" href="mailto:${esc(p.booking_email)}">BOOKING</a>`:''}</div></div></section><div class="content"><div>${block('Présentation',p.presentation)}${block('Biographie',p.bio)}<section class="panel" id="artistNewsArchive"><h2>Actualités conservées</h2><div class="small">Chargement des publications conservées…</div></section><section class="panel"><h2>Expérience</h2><div class="text">${esc(p.experience||'L’expérience détaillée sera ajoutée à cette fiche.')}</div><div class="facts"><div class="fact"><b>RÉGION</b>${esc(p.region||'À préciser')}</div><div class="fact"><b>EXPÉRIENCE</b>${esc(p.experience_years!==null&&p.experience_years!==undefined?p.experience_years+' an'+(Number(p.experience_years)===1?'':'s'):'À préciser')}</div><div class="fact"><b>STYLE</b>${esc(p.genre||'À préciser')}</div></div></section>${qa.length?`<section class="panel"><h2>Mini-conférence de presse</h2>${qa.map(x=>`<div class="qa"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join('')}</section>`:''}<section class="panel"><h2>Médias</h2><div class="media-grid">${safeUrl(p.spotify_url)?`<a class="media-card" href="${esc(p.spotify_url)}" target="_blank" rel="noopener"><span class="meta">MUSIQUE</span><b>Écouter l’artiste</b><span class="small">Ouvrir la plateforme ↗</span></a>`:''}${safeUrl(p.youtube_url)?`<a class="media-card" href="${esc(p.youtube_url)}" target="_blank" rel="noopener"><span class="meta">VIDÉO</span><b>Voir les contenus</b><span class="small">Ouvrir la chaîne ↗</span></a>`:''}${!safeUrl(p.spotify_url)&&!safeUrl(p.youtube_url)?'<div class="empty" style="grid-column:1/-1">Les médias seront ajoutés prochainement.</div>':''}</div></section></div><aside><section class="panel"><h2>Liens officiels</h2><div class="links">${links.join('')||'<div class="small">Les liens officiels seront ajoutés prochainement.</div>'}</div></section>${block('Influences',p.influences)}${block('Projet actuel',p.current_project)}<section class="panel merch"><h2>Merch</h2><div class="text">${esc(p.merch_text||'La collection de cet artiste sera présentée ici.')}</div>${safeUrl(p.merch_url)?`<a class="btn goodbtn" style="display:block;text-align:center;margin-top:14px" href="${esc(p.merch_url)}" target="_blank" rel="noopener">VOIR LE MERCH</a>`:'<a class="btn secondary" style="display:block;text-align:center;margin-top:14px" href="https://rapjungleboutique.vercel.app/#catalogue">VISITER LA BOUTIQUE</a>'}</section></aside></div>`;document.querySelector('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.querySelector('#share').textContent='LIEN COPIÉ'}catch{document.querySelector('#share').textContent='COPIE IMPOSSIBLE'}};loadArchive(p.id)}
async function loadArchive(artistId){
  const box=document.querySelector('#artistNewsArchive');
  if(!box)return;
  try{
    const url=CORE_URL+'/rest/v1/rj_artist_news_archive?artist_profile_id=eq.'+encodeURIComponent(artistId)+'&select=title,body,link_url,author_name,author_type,original_created_at&order=original_created_at.desc';
    const r=await fetch(url,{headers:{apikey:CORE_KEY,Authorization:'Bearer '+CORE_KEY}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rows=await r.json();
    box.innerHTML='<h2>Actualités conservées</h2>'+(rows.length?rows.map(n=>{
      const linkHtml=safeUrl(n.link_url)?'<a class="btn secondary" style="display:inline-block;margin-top:10px" href="'+esc(n.link_url)+'" target="_blank" rel="noopener">OUVRIR LE LIEN</a>':'';
      return '<div class="qa"><h3>'+esc(n.title)+'</h3><div class="small">'+esc(n.author_name)+' · '+new Date(n.original_created_at).toLocaleDateString('fr-CA')+'</div><p>'+esc(n.body)+'</p>'+linkHtml+'</div>';
    }).join(''):'<div class="small">Aucune publication n’a encore été conservée dans cette fiche.</div>');
  }catch(e){
    box.innerHTML='<h2>Actualités conservées</h2><div class="small">Les actualités conservées sont temporairement indisponibles.</div>';
  }
}

async function load(){const id=new URLSearchParams(location.search).get('id');if(!id||!/^[0-9a-f-]{36}$/i.test(id)){document.querySelector('#app').innerHTML='<section class="panel empty"><h2>Fiche introuvable</h2><p>Choisis un artiste depuis le répertoire.</p><a class="btn secondary" href="https://r-pertoirerapjungle.vercel.app/">VOIR LE RÉPERTOIRE</a></section>';return}try{const response=await fetch(`${SUPABASE_URL}/rest/v1/artist_profiles_public?id=eq.${encodeURIComponent(id)}&select=*&limit=1`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!response.ok)throw new Error(`HTTP ${response.status}`);const rows=await response.json();if(!rows.length){document.querySelector('#app').innerHTML='<section class="panel empty"><h2>Fiche introuvable</h2><p>Ce profil n’est pas publié ou n’existe plus.</p><a class="btn secondary" href="https://r-pertoirerapjungle.vercel.app/">VOIR LE RÉPERTOIRE</a></section>';return}render(rows[0])}catch(error){console.error(error);document.querySelector('#app').innerHTML='<section class="panel empty"><h2>Erreur de chargement</h2><p>La fiche est temporairement indisponible.</p></section>'}}
load();
</script></body></html>
